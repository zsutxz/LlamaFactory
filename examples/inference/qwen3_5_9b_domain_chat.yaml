# Qwen3.5-9B（领域 PT/SFT）推理配置：4-bit 量化；仅模型键（chat 的 infer 解析器不接受训练专用键，故独立于 train yaml）
# 环境变量(必需)：LF_ALLOW_TORCH29_CONV3D=1 PYTHONUTF8=1 HF_HOME=E:\AI\LLaMA-Factory\hf_cache HF_HUB_OFFLINE=1
# PT  续写: llamafactory-cli chat examples/inference/qwen3_5_9b_domain_chat.yaml adapter_name_or_path=saves/Qwen3.5-9B-domain-env/lora/pt
# SFT 问答: 上行换 adapter_name_or_path=saves/Qwen3.5-9B-domain-env/lora/pt_then_sft
#   （key=value 覆盖语法；留出 10 题对比时，两 adapter 各答一遍，粘进 data/domain_env_qa_compare.jsonl）
# enable_thinking: false 与 SFT 机制对齐：qwen3_5 是 ReasoningTemplate，SFT 时空 think 块计入 loss，
#   推理关思维链 = 生成点注入 <think>\n\n</think>\n\n（机制同 qwen3，勿用 qwen3_5_nothink——未挂 ReasoningTemplate）
model_name_or_path: model/Qwen3.5-9B-Base
quantization_bit: 4
quantization_method: bnb
template: qwen3_5
enable_thinking: false
infer_backend: huggingface
trust_remote_code: true
