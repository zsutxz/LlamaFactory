### 领域继续预训练（PT）：把专业文档/论文灌进 Qwen3-4B
### 生成：scripts/build_domain_corpus.py（Book PDF + AI Agent 课程 + 论文笔记）
### 训练集：data/domain_papers.jsonl（336 块，约 14.7 万 token）
### 验证集：data/domain_papers_eval.jsonl（38 块，约 1.4 万 token）

### model
model_name_or_path: model/Qwen3-4B      # 本地基座（完整权重，未量化）
trust_remote_code: true

### method
stage: pt                               # 预训练 = 无监督语言建模（纯文本续写）
do_train: true
finetuning_type: lora                   # 16GB 显存跑 4B：LoRA 只训一小部分参数
lora_rank: 8
lora_alpha: 16                          # 缩放倍率 = alpha / rank = 2
lora_target: all                        # 挂在所有线性层上

### dataset
dataset: domain_papers                  # dataset_info.json 里注册的训练集
eval_dataset: domain_papers_eval        # 留出的验证集（算 loss 转 PPL 用）
cutoff_len: 2048                        # 单个训练窗口的 token 上限
preprocessing_num_workers: 1            # Windows 下多进程 map 会卡死，1 = 单进程（语料小够用）
dataloader_num_workers: 0

### output
output_dir: saves/Qwen3-4B-domain/lora/pt
logging_steps: 1
save_steps: 10                          # 每 10 步存一个 checkpoint，防中断丢进度
save_total_limit: 3
plot_loss: true
overwrite_output_dir: true
save_only_model: false
report_to: none

### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 8          # 有效 batch = 1 × 8 = 8 个 2048 窗口
learning_rate: 1.0e-4                   # PT 学习率比 SFT 高（1e-4 ~ 5e-4）
num_train_epochs: 5.0                   # 语料小，多过几遍；领域适配常用 3~5
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
ddp_timeout: 180000000

### eval
per_device_eval_batch_size: 1
eval_strategy: steps
eval_steps: 10
