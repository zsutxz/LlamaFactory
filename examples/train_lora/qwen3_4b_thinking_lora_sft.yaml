# Qwen3-4B + LoRA + Thinking SFT 配置（基于 train_2026-07-27-10-11-28 真实参数）
# 启动: llamafactory-cli train examples/train_lora/qwen3_4b_thinking_lora_sft.yaml
# 或 WebUI 导入后训练（WebUI 会在 output_dir 后自动追加时间戳子目录）
#
# 相对原训练的三处改进（复盘第⑥节 1/2/3）：
#   1. save_total_limit: 3     —— 仅保留最近 3 个 checkpoint，控磁盘（原训练存了 65 个）
#   2. resume_from_checkpoint —— 断点续训开关，见下方 [要点2]
#   3. max_samples            —— 完整训练 / smoke test 两档，见下方 [要点3]
# 注意：要点 2 与 3 互斥。续训时数据规模必须与原训练一致，否则 step 与优化器状态对不上。

### model
model_name_or_path: model/Qwen3-4B
trust_remote_code: true
template: qwen3            # ReasoningTemplate：必须与 enable_thinking 配套，勿改成 qwen3_nothink
enable_thinking: true      # 训练与推理必须一致开启思维链

### method
stage: sft
do_train: true
finetuning_type: lora
lora_rank: 8
lora_alpha: 16
lora_dropout: 0
lora_target: all

### dataset
dataset: alpaca_zh_demo,alpaca_zh,alpaca_en,alpaca_en_demo
dataset_dir: data
cutoff_len: 2048
max_samples: 5000        # [要点3] 完整训练（≈29.5h）；smoke test 改 2000~5000 先验证流程
preprocessing_num_workers: 16
packing: false

### output
output_dir: saves/Qwen3-4B-Thinking/lora/sft
logging_steps: 5
save_steps: 100
save_total_limit: 3        # [要点1] 仅保留最近 3 个 checkpoint，避免堆满磁盘
plot_loss: true
report_to: none

### train
per_device_train_batch_size: 2
gradient_accumulation_steps: 8     # 有效 batch = 16
learning_rate: 5.0e-05             # 比默认 1e-4 减半，4B+LoRA 更稳
num_train_epochs: 1.0
lr_scheduler_type: cosine
warmup_steps: 0
max_grad_norm: 1.0
bf16: true
flash_attn: auto
optim: adamw_torch
seed: 42
include_num_input_tokens_seen: true
# [要点2] 断点续训：训练中途断了想接着跑时，取消注释并指向最近 checkpoint。
#   续训时 max_samples 必须保持 100000 不变（与原训练一致），不可同时用 [要点3] 的 smoke test 值。
#   注：train_2026-07-27-10-11-28 已跑满 1 epoch（step 6554），无需续训，此处仅作语法示例。
# resume_from_checkpoint: saves/Qwen3-4B-Thinking/lora/train_2026-07-27-10-11-28/checkpoint-6500

### eval
