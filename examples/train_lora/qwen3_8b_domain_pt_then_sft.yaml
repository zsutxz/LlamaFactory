### Qwen3-8B 领域 SFT：在 PT adapter 上 resume（方案 B：量化基座单 adapter 续训）
### 目的：验证 PT→SFT 链路能跑通。用自带 alpaca_zh_demo（1000 条中文指令）跑通流程。
### 注意：本数据是通用指令，不是领域 QA——跑通后模型会"会对话"，但未必体现 PT 的领域知识，
###       这正常。真正领域 SFT 需换成你自己的领域问答数据（见 dataset_info.json 注册一份）。
###
### 机制：adapter_name_or_path 把 PT 的 adapter 当 LoRA 初值加载，SFT loss 继续更新【同一个】adapter。
###       量化基座只允许挂 1 个 adapter（parser.py:198-202 / adapter.py:159-161），故不能 create_new_adapter、
###       也不能 merge+resume 多个。若要"PT 固化进基座 + 全新 SFT adapter"，走方案 A（先 export 合并）。

### model
model_name_or_path: model/Qwen3-8B      # 必须与 PT 一致
trust_remote_code: true
quantization_bit: 4                     # 必须与 PT 完全一致，否则 PT 的 A/B 挂不上量化基座
quantization_method: bnb                # bnb nf4

### method
stage: sft                             # 指令微调（区别于 PT 的纯文本续写：只对 assistant 回复算 loss）
do_train: true
finetuning_type: lora
adapter_name_or_path: saves/Qwen3-8B-domain/lora/pt   # ← resume PT adapter（量化基座仅此 1 个）
# 量化基座上切勿加 create_new_adapter: true（会报错 Cannot create new adapter upon a quantized model）
lora_rank: 8                           # 与 PT 一致，否则 A/B 形状对不上
lora_alpha: 16
lora_target: all

### dataset
dataset: alpaca_zh_demo                # 自带 1000 条中文指令（alpaca 格式）
template: qwen3                        # SFT 必须设 template，且与 chat 推理一致（见 examples/inference/qwen3_8b_domain_chat.yaml）
cutoff_len: 2048
max_samples: 100                       # 跑通用：先采样 100 条（≈13 步/epoch）。正式训练删此行用全量 1000 条
preprocessing_num_workers: 1           # Windows 多进程 map 会卡死，沿用 PT 的单进程
dataloader_num_workers: 0

### output
output_dir: saves/Qwen3-8B-domain/lora/pt_then_sft   # 必须换新目录，别覆盖 PT 产物
logging_steps: 1
save_steps: 10                         # 13 步/epoch，存 1 次中途 + 1 次 final
save_total_limit: 3
plot_loss: true
overwrite_output_dir: true
save_only_model: false
report_to: none

### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 8         # 有效 batch = 1 × 8 = 8
learning_rate: 5.0e-5                  # resume 同一 adapter，比 PT(1e-4) 降一档，防把领域知识冲掉
num_train_epochs: 1.0                  # 跑通用 1 epoch；正式训练建议 3.0（去掉 max_samples）
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
ddp_timeout: 180000000

### eval（跑通阶段不开；正式训练想看过拟合情况再取消注释）
