# Qwen3-4B-Thinking 合并后模型推理（merged/，自包含完整模型）
# 启动: llamafactory-cli chat examples/inference/qwen3_merged_chat.yaml
# 与 qwen3_lora_chat.yaml 的区别：model_name_or_path 指向 merged 完整模型，无 adapter_name_or_path
