# Qwen3-4B-Thinking LoRA 合并发布：把 adapter 烧进基座，导出完整自包含模型
# 启动: llamafactory-cli export train_test/examples/merge_lora/qwen3_4b_thinking_export.yaml
# 注意: DO NOT use quantized model or quantization_bit when merging lora adapters
#       合并耗内存 ≈ 模型体积 ×(cpu 慢但稳 / auto 快但占 GPU）

### model
model_name_or_path: model/Qwen3-4B
adapter_name_or_path: train_test/saves/Qwen3-4B-Thinking/lora/sft
template: qwen3
enable_thinking: true
trust_remote_code: true

### export
export_dir: train_test/saves/Qwen3-4B-Thinking/merged
export_size: 5              # 单文件分片大小（GB）
export_device: cpu          # choices: [cpu, auto]
export_legacy_format: false # false=safetensors（推荐）；true=老 pytorch_model.bin
