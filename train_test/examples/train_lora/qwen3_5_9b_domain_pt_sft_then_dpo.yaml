### Qwen3.5-9B 领域 DPO（think 链）：在 PT→SFT adapter 上继续偏好对齐
### 数据：domain_env_pref（蒸馏 QA 过筛答案为 chosen + DeepSeek 定向劣化为 rejected，
###       .claude/skills/public-data-pipeline/scripts/generate_domain_pref.py 产出，213 条，扩量后）
### 环境变量(必需)：LF_ALLOW_TORCH29_CONV3D=1 PYTHONUTF8=1 HF_HOME=E:\AI\LLaMA-Factory\hf_cache HF_HUB_OFFLINE=1
###   （与 SFT 完全一致；LF_ALLOW_TORCH29_CONV3D 仅 9B 需要，启动日志 bypass WARNING 属预期）
###
### 机制：与 SFT 相同，adapter_name_or_path 把 SFT 的 adapter 当 LoRA 初值加载，
###       DPO loss 继续更新【同一个】adapter。量化基座仅允许挂 1 个 adapter
###       （parser.py:198-202 / adapter.py:159-161）。
### reference model：pref_loss=sigmoid 需要 ref。LoRA 模式下自动用"禁用 adapter 的
###       量化基座"（disable_adapter）充当，无需单独加载、不额外占显存。
### 时序：DPO 必须在【已经 SFT 过】的模型上做；chosen 池即 SFT 训练数据（domain_env_qa_sft），
###       同源同 template，logprob 基线对齐。

### model
model_name_or_path: model/Qwen3.5-9B          # think/instruct 版（非 Base），与 pt_think_then_sft 的 adapter_config base 一致
trust_remote_code: true
quantization_bit: 4                           # 必须与 PT/SFT 完全一致，否则 adapter 挂不上量化基座
quantization_method: bnb                      # bnb nf4

### method
stage: dpo                                   # 偏好优化：拉大 chosen/rejected 的 logprob 差
do_train: true
finetuning_type: lora
adapter_name_or_path: saves/Qwen3.5-9B-domain-env/lora/pt_think_then_sft   # ← resume think 链 SFT adapter（前置：think SFT 已训完）
# 量化基座上切勿加 create_new_adapter: true（Cannot create new adapter upon a quantized model）
lora_rank: 8                                 # 与 PT/SFT 一致，否则 A/B 形状对不上
lora_alpha: 16
lora_target: all
pref_beta: 0.1                               # DPO 偏好强度，官方默认 0.1
pref_loss: sigmoid                           # 标准DPO=sigmoid；orpo/simpo 则无需 ref model

### dataset
dataset: domain_env_pref                     # 领域偏好对（alpaca ranking：instruction/input/chosen/rejected）
template: qwen3_5                            # 必须与 SFT/chat 推理一致（ReasoningTemplate，勿改 qwen3_5_nothink）
cutoff_len: 2048
preprocessing_num_workers: 1                 # Windows 多进程 map 会卡死，沿用单进程
dataloader_num_workers: 0

### output
output_dir: saves/Qwen3.5-9B-domain-env/lora/pt_think_sft_then_dpo   # think 链产物独立，勿覆盖 Base 链 pt_sft_then_dpo
logging_steps: 1
save_steps: 30                               # 213条×2epoch≈53步总量，中途存 1 次
save_total_limit: 3
plot_loss: true
overwrite_output_dir: true
save_only_model: false
report_to: none

### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 8               # 有效 batch = 8 → 4 步/epoch
learning_rate: 5.0e-6                        # DPO 比 SFT(5e-5) 小一档，防把 SFT 学到的能力冲掉
num_train_epochs: 2.0                        # 偏好数据 213 条过 2 遍
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
ddp_timeout: 180000000
