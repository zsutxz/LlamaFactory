### Qwen3.5-9B 领域 DPO v2（think 链）：定向补对修复 reward-hacking 后重训
### 与 v1 的唯一差异 = 数据组成（单一变量原则，lr/epochs 等超参不动）：
###   v1 domain_env_pref 213 条四类轮转 → 39 题留出 A/B 败局为"数值自信编造/主体张冠李戴"
###   （docs/train_list.md §13），故 v2 追加 62 条定向对（--defects 数值篡改+无中生有+主体张冠李戴，
###   无中生有=编造原文不存在的具体细节 vs chosen 忠于原文，正面反制编造型偏好）。
### 数据：domain_env_pref_full = v1 213 + v2 定向 62 = 275 条（无中生有 38/数值篡改 12/主体 12 追加）
### 基线：从 pt_think_then_sft 重新续训（同 v1 起点，非在 v1 DPO 产物上叠加）
### 环境变量(必需)：LF_ALLOW_TORCH29_CONV3D=1 PYTHONUTF8=1 HF_HOME=E:\AI\LLaMA-Factory\hf_cache HF_HUB_OFFLINE=1
### 启动：llamafactory-cli train examples/train_lora/qwen3_5_9b_domain_pt_sft_then_dpo_v2.yaml

### model
model_name_or_path: model/Qwen3.5-9B          # think/instruct 版（非 Base），与 pt_think_then_sft 的 adapter_config base 一致
trust_remote_code: true
quantization_bit: 4                           # 必须与 PT/SFT 完全一致，否则 adapter 挂不上量化基座
quantization_method: bnb                      # bnb nf4

### method
stage: dpo
do_train: true
finetuning_type: lora
adapter_name_or_path: saves/Qwen3.5-9B-domain-env/lora/pt_think_then_sft   # ← 同 v1：SFT 基线重训（勿指向 v1 DPO 产物）
# 量化基座上切勿加 create_new_adapter: true（Cannot create new adapter upon a quantized model）
lora_rank: 8                                 # 与 PT/SFT 一致，否则 A/B 形状对不上
lora_alpha: 16
lora_target: all
pref_beta: 0.1                               # DPO 偏好强度，官方默认 0.1
pref_loss: sigmoid                           # ref=禁用 adapter 的量化基座，零额外显存

### dataset
dataset: domain_env_pref_full                # v1 213 + v2 定向 62 = 275 条
template: qwen3_5                            # 与 SFT/chat 推理一致（ReasoningTemplate，勿改 qwen3_5_nothink）
cutoff_len: 2048
preprocessing_num_workers: 1                 # Windows 多进程 map 会卡死，沿用单进程
dataloader_num_workers: 0

### output
output_dir: saves/Qwen3.5-9B-domain-env/lora/pt_think_sft_then_dpo_v2   # 独立目录，勿覆盖 v1
logging_steps: 1
save_steps: 30                               # 275条×2epoch≈69步总量，中途存 2 次
save_total_limit: 3
plot_loss: true
overwrite_output_dir: true
save_only_model: false
report_to: none

### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 8               # 有效 batch = 8
learning_rate: 5.0e-6                        # 同 v1（单一变量原则：只改数据不改超参）
num_train_epochs: 2.0                        # 同 v1
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
ddp_timeout: 180000000
