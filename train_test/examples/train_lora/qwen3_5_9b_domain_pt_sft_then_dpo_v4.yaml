### Qwen3.5-9B 领域 DPO v4（think 链）：教训对照式重试（docs/train_list.md §8 六条纪律的落地）
### 与 v1 的差异（超参逐字相同，lr/epochs/beta/loss=sigmoid 均不动）：
###   1. 数据：domain_env_pref_v4 310 对 = v1 配方（--defects 四类经典轮转，无数值外新 defect）
###      作用于当前全量种子池 domain_env_qa_sft_v4 = 305 过筛 QA + 5 定向补强 QA
###      （定向 QA 数值类事实做成"数值篡改"负样本，双重强化 §14 教的事实）
###      ——不用 v2 的无中生有对（§13.4：推向保守少细节）、不用 v3 的 on-policy 对（§13.5：结构模仿泛化成编程序细节）
###   2. 基线：pt_think_then_sft_t（§14 定向补强版，4/5 知识缺口已补；§13.6 前置"知识到位"）
###      A/B 对照列 = SFT_t 自身答案（train_test/data/domain_env_sftt_check.jsonl 已有）
### 环境变量(必需)：LF_ALLOW_TORCH29_CONV3D=1 PYTHONUTF8=1 HF_HOME=E:\AI\LLaMA-Factory\hf_cache HF_HUB_OFFLINE=1
### 启动：llamafactory-cli train train_test/examples/train_lora/qwen3_5_9b_domain_pt_sft_then_dpo_v4.yaml

### model
model_name_or_path: model/Qwen3.5-9B          # think/instruct 版（非 Base），与 pt_think_then_sft 的 adapter_config base 一致
trust_remote_code: true
quantization_bit: 4                           # 必须与 PT/SFT 完全一致，否则 adapter 挂不上量化基座
quantization_method: bnb                      # bnb nf4

### method
stage: dpo
do_train: true
finetuning_type: lora
adapter_name_or_path: train_test/saves/Qwen3.5-9B-domain-env/lora/pt_think_then_sft_t   # ← v4 换知识到位基线（SFT 定向补强版）
lora_rank: 8                                 # 与 PT/SFT 一致，否则 A/B 形状对不上
lora_alpha: 16
lora_target: all
pref_beta: 0.1                               # DPO 偏好强度，官方默认 0.1（同 v1）
pref_loss: sigmoid                           # v1 同款（唯一净正配置；v3 的 IPO 已实测无效）

### dataset
dataset: domain_env_pref_v4                  # 310 对，v1 配方四类缺陷轮转
dataset_dir: train_test/data
template: qwen3_5                            # 必须与 SFT/chat 推理一致（ReasoningTemplate，勿改 qwen3_5_nothink）
cutoff_len: 2048
preprocessing_num_workers: 1                 # Windows 多进程 map 会卡死，沿用单进程
dataloader_num_workers: 0

### output
output_dir: train_test/saves/Qwen3.5-9B-domain-env/lora/pt_think_sft_then_dpo_v4   # 独立目录，勿覆盖 v1/v2/v3
logging_steps: 1
save_steps: 40                               # 310 种子机械校验后 215 对×2epoch≈54步总量
save_total_limit: 3
plot_loss: true
overwrite_output_dir: true
save_only_model: false
report_to: none

### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 8               # 有效 batch = 8
learning_rate: 5.0e-6                        # DPO 比 SFT(5e-5) 小一档，防把 SFT 学到的能力冲掉（同 v1）
num_train_epochs: 2.0                        # 同 v1
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
ddp_timeout: 180000000
