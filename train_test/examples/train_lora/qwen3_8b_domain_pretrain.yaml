### 领域继续预训练（PT）：把「环境保护」语料灌进 Qwen3-8B（4-bit QLoRA）
### 生成：.claude/skills/public-data-pipeline/scripts/build_domain_corpus.py --src data_raw --out-prefix domain_env
###       原始语料由 public-data-pipeline skill 采集（法律法规/行业标准/论文，见 data_raw/）
### 训练集：data/domain_env.jsonl（566 块，中文为主，约 55 万 token）
### 验证集：data/domain_env_eval.jsonl（63 块，约 6 万 token）

### model
model_name_or_path: model/Qwen3-8B      # 本地基座（完整 bf16 权重，训练时按 4-bit 量化加载）
trust_remote_code: true
quantization_bit: 4                     # 8B bf16 权重约 15.5GB，16GB 卡必须 4-bit 量化，否则 OOM
quantization_method: bnb                # bitsandbytes nf4（RTX 5060 Ti / Blackwell sm_120 实测可用）

### method
stage: pt                               # 预训练 = 无监督语言建模（纯文本续写）
do_train: true
finetuning_type: lora                   # QLoRA = 4-bit 量化基座 + LoRA，16GB 跑 8B 的唯一可行配置
lora_rank: 8
lora_alpha: 16                          # 缩放倍率 = alpha / rank = 2
lora_target: all                        # 挂在所有线性层上（可训练 21.8M / 82 亿 = 0.27%）

### dataset
dataset: domain_env                     # dataset_info.json 里注册的训练集（环保领域）
eval_dataset: domain_env_eval           # 留出的验证集（算 loss 转 PPL 用）
cutoff_len: 2048                        # 单个训练窗口的 token 上限
preprocessing_num_workers: 1            # Windows 下多进程 map 会卡死，1 = 单进程（语料小够用）
dataloader_num_workers: 0

### output
output_dir: saves/Qwen3-8B-domain-env/lora/pt   # 与 domain_papers 产物分离，避免 overwrite_output_dir 互相覆盖
logging_steps: 1
save_steps: 10                          # 每 10 步存一个 checkpoint，防中断丢进度
save_total_limit: 3
plot_loss: true
overwrite_output_dir: true
save_only_model: false
report_to: none

### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 8          # 有效 batch = 1 × 8 = 8 个 2048 窗口
learning_rate: 1.0e-4                   # PT 学习率比 SFT 高（1e-4 ~ 5e-4）
num_train_epochs: 5.0                   # 语料小，多过几遍；领域适配常用 3~5
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
ddp_timeout: 180000000

### eval
per_device_eval_batch_size: 1
eval_strategy: steps
eval_steps: 10
