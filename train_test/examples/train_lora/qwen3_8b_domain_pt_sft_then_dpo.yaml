### Qwen3-8B 领域 DPO：在 PT→SFT adapter 上继续偏好对齐
### 目的：验证 PT→SFT→DPO 链路能跑通。用自带 dpo_zh_demo（中文偏好数据）跑通流程。
### 数据：dpo_zh_demo 是通用偏好对，不是领域偏好——跑通后需换成你自己的领域偏好数据
###       （构造 chosen/rejected 对，见本目录下其它示例与 train_test/data/dataset_info.json 的 dpo_zh_demo 注册项）。
###
### 机制：与 PT→SFT 相同，adapter_name_or_path 把 SFT 的 adapter 当 LoRA 初值加载，
###       DPO loss 继续更新【同一个】adapter。量化基座仍只允许挂 1 个 adapter
###       （parser.py:198-202 / adapter.py:159-161），故不能 create_new_adapter。
###
### DPO 的 reference model：pref_loss=sigmoid 需要参考模型。LoRA 模式下 LLaMA-Factory
###       自动用"禁用 adapter 的量化基座"作为 ref（disable_adapter），无需单独加载、不额外占显存。
###       ORPO/SimPO 连 ref 都不需要（见 pref_loss 注释）。
###
### 时序：DPO 必须在【已经 SFT 过】的模型上做（裸 LoRA / 裸基座直接 DPO 效果差）。
###       所以链路是 PT → SFT → DPO，本配置 resume 的就是 SFT 产物 pt_then_sft。
###       前置条件：train_test/saves/Qwen3-8B-domain/lora/pt_then_sft 下已有 SFT 的 adapter 产物。

### model
model_name_or_path: model/Qwen3-8B      # 必须与 PT/SFT 一致
trust_remote_code: true
quantization_bit: 4                     # 必须与 PT/SFT 完全一致，否则 adapter 挂不上量化基座
quantization_method: bnb                # bnb nf4

### method
stage: dpo                              # 偏好优化：对 chosen 提升奖励、对 rejected 压低，拉大两者差距
do_train: true
finetuning_type: lora
adapter_name_or_path: train_test/saves/Qwen3-8B-domain/lora/pt_then_sft   # ← resume SFT adapter（量化基座仅此 1 个）
# 量化基座上切勿加 create_new_adapter: true（会报错 Cannot create new adapter upon a quantized model）
lora_rank: 8                            # 与 PT/SFT 一致，否则 A/B 形状对不上
lora_alpha: 16
lora_target: all
pref_beta: 0.1                          # DPO 偏好强度系数，官方默认 0.1；越大越贴近 ref、越保守
pref_loss: sigmoid                      # 标准DPO=sigmoid；另可选 orpo / simpo（均无需 ref model）

### dataset
dataset: dpo_zh_demo                    # 自带中文偏好对（sharegpt 格式：conversations + chosen + rejected）
dataset_dir: train_test/data
template: qwen3                         # 必须与 SFT / chat 推理一致，否则 chosen/rejected 的 logprob 对不上
cutoff_len: 2048
max_samples: 100                        # 跑通用：先采样 100 条。正式训练删此行用全量
preprocessing_num_workers: 1            # Windows 多进程 map 会卡死，沿用 PT/SFT 单进程
dataloader_num_workers: 0

### output
output_dir: train_test/saves/Qwen3-8B-domain/lora/pt_sft_then_dpo   # 必须换新目录，别覆盖 SFT 产物
logging_steps: 1
save_steps: 10                          # 跑通阶段存 1 次中途 + 1 次 final
save_total_limit: 3
plot_loss: true
overwrite_output_dir: true
save_only_model: false
report_to: none

### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 8          # 有效 batch = 1 × 8 = 8
learning_rate: 5.0e-6                   # DPO 比 SFT(5e-5) 小一档，防把 SFT 学到的能力冲掉
num_train_epochs: 1.0                   # 跑通用 1 epoch；正式训练建议 1~2（DPO 一般不需要太多轮）
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
ddp_timeout: 180000000

### eval（跑通阶段不开；正式训练想看偏好准确率再取消注释）
